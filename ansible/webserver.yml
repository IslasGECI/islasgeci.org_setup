---
- name: Set system up
  hosts: webserver
  tasks:
    - name: Create ciencia_datos user
      user:
        name: ciencia_datos
        shell: /bin/bash
        groups: docker
        append: true
      become: true
    - name: Set time zone
      timezone:
        name: America/Los_Angeles
      become: true

- name: Install software using package managers
  hosts: webserver
  tasks:
    - name: Update system
      apt:
        update_cache: true
      become: true
    - name: Install cURL
      apt:
        name: "curl"
        state: present
      become: true
    - name: Install Docker
      apt:
        name: "docker.io"
        state: present
      become: true
    - name: Install Docker-compose
      apt:
        name: "docker-compose"
        state: present
      become: true
    - name: Install Git
      apt:
        name: "git"
        state: present
      become: true
    - name: Install Make
      apt:
        name: "make"
        state: present
      become: true
    - name: Install pip
      apt:
        name: "python3-pip"
        state: present
      become: true
    - name: Install pipx
      ansible.builtin.apt:
        name: "pipx"
        state: present
      become: true
    - name: Install Docker SDK for Python
      community.general.pipx:
        name: docker
        install_deps: true
      notify: Restart server
    - name: Add '{{ ansible_user_id }}' to docker group
      user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: true
      become: true
      notify: Restart server
  handlers:
    - name: Restart server
      ansible.builtin.reboot:
        reboot_timeout: 1200
        post_reboot_delay: 30
      become: true

- name: Run Web Server container
  hosts: webserver
  tasks:
    - name: Copy SSH keys
      copy:
        src: /root/.ssh/id_rsa
        dest: /tmp/id_rsa
        mode: '0600'
    - name: Copy secrets
      copy:
        src: /root/.vault/
        dest: /home/ciencia_datos/.vault/
        mode: '0600'
    - name: Start the container
      community.docker.docker_container:
        name: islasgeci.org
        image: islasgeci/islasgeci.org:latest
        container_default_behavior: no_defaults
        state: started
        detach: true
        volumes:
          - /home/ciencia_datos/.vault/.secrets:/home/ciencia_datos/.vault/.secrets
          - /var/run/docker.sock:/var/run/docker.sock
